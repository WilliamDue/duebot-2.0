name: Build Binaries

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs:
  build: 
    name: Build on ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            platform: linux
          - os: ubuntu-latest
            arch: arm64
            platform: linux

    steps:
    - uses:  actions/checkout@v4

    - name: Set up Haskell
      uses: haskell-actions/setup@v2
      with: 
        ghc-version: '9.8'
        cabal-version: '3.14'

    - name: Cache Cabal packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cabal/packages
          ~/. cabal/store
          dist-newstyle
        key:  ${{ runner.os }}-${{ matrix.arch }}-cabal-${{ hashFiles('**/*.cabal', '**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-cabal-

    - name: Update Cabal package list
      run: cabal update

    - name: Build dependencies
      run: cabal build --only-dependencies

    - name: Build project
      run: cabal build

    - name: Find executable
      id: find-exe
      run: |
        EXE_PATH=$(cabal list-bin duebot)
        echo "exe_path=$EXE_PATH" >> $GITHUB_OUTPUT
        echo "Found executable at: $EXE_PATH"

    - name: Create artifact directory
      run: mkdir -p artifacts

    - name: Copy binary
      run: |
        cp ${{ steps.find-exe.outputs.exe_path }} artifacts/duebot-${{ matrix.platform }}-${{ matrix.arch }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name:  duebot-${{ matrix.platform }}-${{ matrix.arch }}
        path: artifacts/duebot-${{ matrix.platform }}-${{ matrix.arch }}
